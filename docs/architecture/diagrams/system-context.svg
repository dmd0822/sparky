<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 14px Arial, sans-serif; fill: #1f2937; }
      .small { font: 12px Arial, sans-serif; fill: #374151; }
      .box { fill: #edf6ff; stroke: #2563eb; stroke-width: 2; }
      .azure { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
      .device { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .wire { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .note { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="510" y="40" text-anchor="middle" class="title">Sparky System Context</text>

  <rect x="40" y="80" width="300" height="420" rx="12" class="device"/>
  <text x="190" y="115" text-anchor="middle" class="label">Sparky Device</text>
  <text x="190" y="140" text-anchor="middle" class="small">Raspberry Pi + PiDog hardware</text>

  <rect x="100" y="175" width="180" height="70" rx="10" class="box"/>
  <text x="190" y="215" text-anchor="middle" class="label">Sparky Application</text>

  <rect x="100" y="280" width="180" height="120" rx="10" class="box"/>
  <text x="190" y="320" text-anchor="middle" class="label">PiDog Hardware</text>
  <text x="190" y="345" text-anchor="middle" class="small">Servos, speaker, mic,</text>
  <text x="190" y="365" text-anchor="middle" class="small">LED, sensors</text>

  <rect x="100" y="430" width="180" height="46" rx="10" class="note"/>
  <text x="190" y="458" text-anchor="middle" class="label">Independent E-Stop</text>

  <rect x="430" y="80" width="300" height="420" rx="12" class="azure"/>
  <text x="580" y="115" text-anchor="middle" class="label">Azure</text>
  <text x="580" y="140" text-anchor="middle" class="small">Secure broker + services</text>

  <rect x="490" y="175" width="180" height="70" rx="10" class="box"/>
  <text x="580" y="215" text-anchor="middle" class="label">Sparky Broker</text>

  <rect x="490" y="280" width="180" height="60" rx="10" class="box"/>
  <text x="580" y="315" text-anchor="middle" class="label">Azure Speech</text>

  <rect x="490" y="360" width="180" height="60" rx="10" class="box"/>
  <text x="580" y="395" text-anchor="middle" class="label">Language Model</text>

  <rect x="760" y="80" width="300" height="420" rx="12" class="azure"/>
  <text x="910" y="115" text-anchor="middle" class="label">Ops & Safety</text>
  <text x="910" y="140" text-anchor="middle" class="small">Telemetry, content safety</text>

  <rect x="820" y="185" width="180" height="70" rx="10" class="box"/>
  <text x="910" y="225" text-anchor="middle" class="label">Content Safety</text>

  <rect x="820" y="295" width="180" height="70" rx="10" class="box"/>
  <text x="910" y="335" text-anchor="middle" class="label">Telemetry</text>

  <path d="M340 210 L490 210" class="wire"/>
  <text x="410" y="195" class="small">speech + touch</text>
  <path d="M340 350 L490 350" class="wire"/>
  <text x="410" y="335" class="small">semantic motion</text>

  <path d="M670 210 L820 210" class="wire"/>
  <text x="745" y="195" class="small">managed identity</text>
  <path d="M670 315 L820 315" class="wire"/>
  <text x="745" y="300" class="small">managed identity</text>
  <path d="M670 390 L820 390" class="wire"/>
  <text x="745" y="375" class="small">managed identity</text>

  <path d="M280 430 L280 470 L430 470" class="dashed"/>
  <text x="330" y="460" class="small">hardware inhibit</text>

  <path d="M190 420 L190 465" class="wire"/>
  <text x="210" y="448" class="small">arm / reset</text>

  <path d="M580 430 L580 470 L760 470" class="dashed"/>
  <text x="660" y="460" class="small">no direct model route</text>
</svg>
