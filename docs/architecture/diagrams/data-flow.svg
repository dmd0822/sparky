<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 15px Arial, sans-serif; fill: #1f2937; }
      .small { font: 12px Arial, sans-serif; fill: #374151; }
      .box { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .ok { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .warn { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2; }
      .danger { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; }
      .wire { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="600" y="36" text-anchor="middle" class="title">End-to-End Audio, LLM, Persona, and Motion Flow</text>

  <rect x="50" y="80" width="170" height="72" rx="12" class="box"/><text x="135" y="122" text-anchor="middle" class="label">Talk control</text>
  <rect x="270" y="80" width="170" height="72" rx="12" class="box"/><text x="355" y="122" text-anchor="middle" class="label">Audio capture</text>
  <rect x="490" y="80" width="170" height="72" rx="12" class="box"/><text x="575" y="122" text-anchor="middle" class="label">STT via broker</text>

  <rect x="710" y="80" width="170" height="72" rx="12" class="box"/><text x="795" y="122" text-anchor="middle" class="label">Safety check</text>
  <rect x="930" y="80" width="170" height="72" rx="12" class="box"/><text x="1015" y="122" text-anchor="middle" class="label">Persona prompt</text>

  <rect x="50" y="220" width="170" height="72" rx="12" class="box"/><text x="135" y="262" text-anchor="middle" class="label">LLM</text>
  <rect x="270" y="220" width="170" height="72" rx="12" class="box"/><text x="355" y="262" text-anchor="middle" class="label">Reply + gesture</text>
  <rect x="490" y="220" width="170" height="72" rx="12" class="box"/><text x="575" y="262" text-anchor="middle" class="label">Output safety</text>

  <rect x="710" y="220" width="170" height="72" rx="12" class="box"/><text x="795" y="262" text-anchor="middle" class="label">Gesture validator</text>
  <rect x="930" y="220" width="170" height="72" rx="12" class="box"/><text x="1015" y="262" text-anchor="middle" class="label">Motion arbiter</text>

  <rect x="270" y="360" width="170" height="72" rx="12" class="box"/><text x="355" y="402" text-anchor="middle" class="label">TTS</text>
  <rect x="490" y="360" width="170" height="72" rx="12" class="box"/><text x="575" y="402" text-anchor="middle" class="label">Audio playback</text>
  <rect x="710" y="360" width="170" height="72" rx="12" class="box"/><text x="795" y="402" text-anchor="middle" class="label">Servo / tail / LED</text>
  <rect x="930" y="360" width="170" height="72" rx="12" class="ok"/><text x="1015" y="402" text-anchor="middle" class="label">No retention</text>

  <rect x="420" y="520" width="360" height="100" rx="12" class="warn"/><text x="600" y="560" text-anchor="middle" class="label">Safe refusal path</text><text x="600" y="585" text-anchor="middle" class="small">Persona-voiced apology or fallback</text>

  <path d="M220 116 L270 116" class="wire"/>
  <path d="M440 116 L490 116" class="wire"/>
  <path d="M660 116 L710 116" class="wire"/>
  <path d="M880 116 L930 116" class="wire"/>

  <path d="M135 152 L135 220" class="wire"/>
  <path d="M355 152 L355 220" class="wire"/>
  <path d="M575 152 L575 220" class="wire"/>
  <path d="M795 152 L795 220" class="wire"/>
  <path d="M1015 152 L1015 220" class="wire"/>

  <path d="M220 256 L270 256" class="wire"/>
  <path d="M440 256 L490 256" class="wire"/>
  <path d="M660 256 L710 256" class="wire"/>
  <path d="M880 256 L930 256" class="wire"/>

  <path d="M355 292 L355 360" class="wire"/>
  <path d="M575 292 L575 360" class="wire"/>
  <path d="M795 292 L795 360" class="wire"/>
  <path d="M1015 292 L1015 360" class="wire"/>

  <path d="M440 396 L490 396" class="wire"/>
  <path d="M660 396 L710 396" class="wire"/>
  <path d="M880 396 L930 396" class="wire"/>

  <path d="M600 432 L600 520" class="wire"/>
  <path d="M710 256 L710 308 L600 308 L600 520" class="dashed"/>
  <path d="M575 292 L575 520" class="dashed"/>
  <path d="M355 432 L355 500 L420 500" class="dashed"/>

  <text x="720" y="340" class="small">validated semantic command</text>
  <text x="130" y="198" class="small">generation id</text>
  <text x="520" y="204" class="small">allowed / blocked</text>
  <text x="510" y="505" class="small">blocked output</text>
</svg>
