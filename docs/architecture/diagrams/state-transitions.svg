<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 15px Arial, sans-serif; fill: #1f2937; }
      .small { font: 12px Arial, sans-serif; fill: #374151; }
      .box { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .warn { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2; }
      .danger { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; }
      .safe { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .wire { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="600" y="40" text-anchor="middle" class="title">Runtime State Transitions</text>

  <rect x="80" y="90" width="160" height="60" rx="12" class="box"/><text x="160" y="127" text-anchor="middle" class="label">Booting</text>
  <rect x="290" y="90" width="160" height="60" rx="12" class="box"/><text x="370" y="127" text-anchor="middle" class="label">Inhibited</text>
  <rect x="500" y="90" width="160" height="60" rx="12" class="box"/><text x="580" y="127" text-anchor="middle" class="label">SelfTest</text>
  <rect x="710" y="90" width="160" height="60" rx="12" class="safe"/><text x="790" y="127" text-anchor="middle" class="label">Idle</text>
  <rect x="920" y="90" width="160" height="60" rx="12" class="box"/><text x="1000" y="127" text-anchor="middle" class="label">Listening</text>

  <rect x="290" y="240" width="160" height="60" rx="12" class="box"/><text x="370" y="277" text-anchor="middle" class="label">Thinking</text>
  <rect x="500" y="240" width="160" height="60" rx="12" class="box"/><text x="580" y="277" text-anchor="middle" class="label">Speaking</text>
  <rect x="710" y="240" width="160" height="60" rx="12" class="warn"/><text x="790" y="277" text-anchor="middle" class="label">Degraded</text>
  <rect x="920" y="240" width="160" height="60" rx="12" class="danger"/><text x="1000" y="277" text-anchor="middle" class="label">SafeStop</text>

  <rect x="500" y="390" width="160" height="60" rx="12" class="danger"/><text x="580" y="427" text-anchor="middle" class="label">EStopped</text>
  <rect x="710" y="390" width="160" height="60" rx="12" class="box"/><text x="790" y="427" text-anchor="middle" class="label">Latched</text>

  <path d="M240 120 L290 120" class="wire"/>
  <path d="M450 120 L500 120" class="wire"/>
  <path d="M660 120 L710 120" class="wire"/>
  <path d="M870 120 L920 120" class="wire"/>

  <path d="M370 150 L370 240" class="wire"/>
  <path d="M580 150 L580 240" class="wire"/>
  <path d="M790 150 L790 240" class="wire"/>
  <path d="M1000 150 L1000 240" class="wire"/>

  <path d="M370 300 L370 365 L500 365" class="wire"/>
  <path d="M580 300 L580 390" class="wire"/>
  <path d="M790 300 L790 390" class="wire"/>
  <path d="M1000 300 L1000 365 L660 365" class="wire"/>

  <path d="M500 420 L370 420 L370 330" class="wire"/>
  <path d="M660 420 L710 420" class="wire"/>
  <path d="M790 450 L790 520 L520 520 L520 450" class="wire"/>

  <text x="255" y="105" class="small">process start</text>
  <text x="465" y="105" class="small">arm request</text>
  <text x="675" y="105" class="small">self-test passed</text>
  <text x="890" y="105" class="small">talk pressed</text>
  <text x="385" y="214" class="small">capture ended</text>
  <text x="595" y="214" class="small">reply ready</text>
  <text x="795" y="214" class="small">cloud outage</text>
  <text x="1010" y="214" class="small">fault / watchdog</text>
  <text x="435" y="360" class="small">barge-in</text>
  <text x="605" y="380" class="small">fault</text>
  <text x="720" y="470" class="small">operator reset</text>
</svg>
