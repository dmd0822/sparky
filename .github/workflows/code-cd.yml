name: Code CD

# Application delivery only. Infrastructure is deployed by infra-cd.yml; this
# workflow builds and publishes the relay image and rolls it out to the
# existing Container App.
#
# Auth is keyless: GitHub OIDC / workload identity federation only. ACR access
# goes through Entra ID RBAC (`az acr login` exchanges the ARM token), so the
# registry admin user stays disabled and no registry password is ever stored.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Logical environment to deploy
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/code-cd.yml'

permissions:
  contents: read

concurrency:
  group: code-cd-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Run repository tests
        run: python -m unittest discover -s tests

  publish:
    name: Build and publish relay image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    env:
      ENVIRONMENT_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-sparky' }}
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Resolves infra-owned names from the deployed resource group instead of
      # duplicating the sparky-<resource>-<env> convention in this workflow.
      - name: Resolve registry from deployed infrastructure
        id: registry
        run: |
          ACR_NAME="$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?tags.environment=='${ENVIRONMENT_NAME}'] | [0].name" \
            --output tsv)"
          if [ -z "$ACR_NAME" ]; then
            echo "::error::No container registry tagged environment=${ENVIRONMENT_NAME} in ${RESOURCE_GROUP}. Run infra-cd.yml first."
            exit 1
          fi
          echo "acr-name=$ACR_NAME" >> "$GITHUB_OUTPUT"

      # Entra-backed registry auth. The registry admin user stays disabled and
      # no registry password is ever read or stored.
      - name: Authenticate to registry with Entra ID
        run: az acr login --name "${{ steps.registry.outputs.acr-name }}"

      - name: Build and push relay image
        id: build
        env:
          ACR_NAME: ${{ steps.registry.outputs.acr-name }}
        run: |
          IMAGE="sparky-relay:${{ github.sha }}"
          if [ -f src/cloud/Dockerfile ]; then
            az acr build \
              --registry "$ACR_NAME" \
              --image "$IMAGE" \
              --file src/cloud/Dockerfile \
              src
            echo "image=${ACR_NAME}.azurecr.io/${IMAGE}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::src/cloud/Dockerfile is missing. The relay image cannot be built, so this deploy would silently leave the previous image running. Restore src/cloud/Dockerfile."
            exit 1
          fi

  deploy:
    name: Deploy relay
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    env:
      ENVIRONMENT_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-sparky' }}
      RELAY_IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The app is provisioned with registries: [] on the public baseline image
      # (documented in the dev environment template), so attach the registry
      # credential at the private image-flip time.
      - name: Configure relay registry credential
        run: |
          if [ -z "$RELAY_IMAGE" ]; then
            echo "::error::The publish job produced no image reference. Refusing to report a successful deploy that changed nothing."
            exit 1
          fi
          ACR_LOGIN_SERVER="${RELAY_IMAGE%%/*}"
          az containerapp registry set \
            --name "sparky-relay-${ENVIRONMENT_NAME}" \
            --resource-group "$RESOURCE_GROUP" \
            --server "$ACR_LOGIN_SERVER" \
            --identity system

      - name: Update relay container app
        run: |
          if [ -z "$RELAY_IMAGE" ]; then
            echo "::error::The publish job produced no image reference. Refusing to report a successful deploy that changed nothing."
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if az containerapp update \
              --name "sparky-relay-${ENVIRONMENT_NAME}" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$RELAY_IMAGE"; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 5 ]; then
              exit "$status"
            fi
            echo "::warning::Relay image update failed on attempt ${attempt}; retrying in 20 seconds."
            sleep 20
          done
          echo "::error::Relay image update failed after retry loop exited unexpectedly."
          exit 1

      - name: Verify relay revision became healthy
        run: |
          set -euo pipefail
          # `az containerapp update` returning 0 only means the control plane accepted
          # the new revision. If the container then crashes on startup, Container Apps
          # keeps routing to the previous healthy revision and this workflow would
          # report a successful deploy while the old image still serves every request.
          # That is exactly how a crash-looping revision went unnoticed, so assert the
          # new revision actually reached a good running state before declaring success.
          APP_NAME="sparky-relay-${ENVIRONMENT_NAME}"
          REVISION="$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.latestRevisionName" -o tsv)"
          if [ -z "$REVISION" ] || [ "$REVISION" = "None" ]; then
            echo "::error::Could not resolve the latest revision for ${APP_NAME}."
            exit 1
          fi
          echo "Waiting for revision ${REVISION} to report a healthy running state."
          for attempt in $(seq 1 20); do
            RUNNING_STATE="$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION" \
              --query "properties.runningState" -o tsv 2>/dev/null || echo "")"
            HEALTH_STATE="$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION" \
              --query "properties.healthState" -o tsv 2>/dev/null || echo "")"
            echo "Attempt ${attempt}: runningState=${RUNNING_STATE:-unknown} healthState=${HEALTH_STATE:-unknown}"
            case "$RUNNING_STATE" in
              ActivationFailed|Failed|Degraded)
                echo "::error::Revision ${REVISION} reported runningState=${RUNNING_STATE}. The published image did not start, so traffic is still served by the previous revision."
                az containerapp revision show \
                  --name "$APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --revision "$REVISION" \
                  --query "{runningState:properties.runningState,healthState:properties.healthState,image:properties.template.containers[0].image}" -o json || true
                exit 1
                ;;
              Running|RunningAtMaxScale|ScaledToZero)
                if [ "$HEALTH_STATE" = "Unhealthy" ]; then
                  echo "::error::Revision ${REVISION} is ${RUNNING_STATE} but reports healthState=Unhealthy."
                  exit 1
                fi
                echo "Revision ${REVISION} is ${RUNNING_STATE}."
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "::error::Revision ${REVISION} never reached a healthy running state within the timeout."
          exit 1
