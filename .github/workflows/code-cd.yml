name: Code CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/code-cd.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Validate Python package metadata
        run: |
          python -m unittest discover -s tests

      - name: Confirm deployment package is ready
        run: echo "Application delivery workflow ready. This placeholder pipeline is intentionally separated from infra deployment."
