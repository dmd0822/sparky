name: Infra CD

# Manual-only infrastructure deployment. Uses Incremental mode, never Complete,
# and always runs what-if before create.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Logical environment to deploy
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if deployment
        run: |
          az deployment group what-if \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --parameters infra/environments/${{ inputs.environment }}/main.bicepparam \
            --mode Incremental

      - name: Deploy infrastructure
        run: |
          az deployment group create \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --parameters infra/environments/${{ inputs.environment }}/main.bicepparam \
            --mode Incremental
