name: Infra CI

# NOTE: infra/environments/{dev,prod}/main.bicep do not exist yet. This is
# partial M1 scaffolding: validation is skipped (not faked) until both entry
# points land together. See infra/README.md for the planned layout.

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-ci.yml'
      - 'docs/deployment-setup.md'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/infra-ci.yml'
      - 'docs/deployment-setup.md'

jobs:
  validate-bicep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Check environment entry points
        id: check
        run: |
          dev_exists=false
          prod_exists=false
          if [ -f infra/environments/dev/main.bicep ]; then dev_exists=true; fi
          if [ -f infra/environments/prod/main.bicep ]; then prod_exists=true; fi

          if [ "$dev_exists" = "false" ] && [ "$prod_exists" = "false" ]; then
            echo "::notice::Neither infra/environments/dev/main.bicep nor infra/environments/prod/main.bicep exist yet. Infra is still partial scaffolding (see infra/README.md); skipping Bicep validation until both entry points are added."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$dev_exists" != "$prod_exists" ]; then
            echo "::error::Only one of infra/environments/{dev,prod}/main.bicep exists (dev=$dev_exists, prod=$prod_exists). Both environment entry points must be added together, or neither. Failing instead of silently skipping validation."
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Validate dev environment
        if: steps.check.outputs.skip == 'false'
        run: az bicep build --file infra/environments/dev/main.bicep --stdout >/dev/null

      - name: Validate prod environment
        if: steps.check.outputs.skip == 'false'
        run: az bicep build --file infra/environments/prod/main.bicep --stdout >/dev/null