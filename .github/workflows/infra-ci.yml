name: Infra CI

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'tests/test_infra_policy.py'
      - '.github/workflows/infra-ci.yml'
      - 'docs/deployment-setup.md'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'tests/test_infra_policy.py'
      - '.github/workflows/infra-ci.yml'
      - 'docs/deployment-setup.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 #v5
        with:
          python-version: "3.11"

      - name: Build Bicep modules
        shell: pwsh
        run: |
          Get-ChildItem infra/modules -Filter *.bicep | Sort-Object FullName | ForEach-Object {
            az bicep build --file $_.FullName --stdout | Out-Null
          }

      - name: Build environment entry points
        shell: pwsh
        run: |
          az bicep build --file infra/environments/dev/main.bicep --stdout | Out-Null
          az bicep build --file infra/environments/prod/main.bicep --stdout | Out-Null

      - name: Build environment parameter files
        shell: pwsh
        run: |
          az bicep build-params --file infra/environments/dev/main.bicepparam --stdout | Out-Null
          az bicep build-params --file infra/environments/prod/main.bicepparam --stdout | Out-Null

      - name: Run static infra policy tests
        run: python -m unittest tests.test_infra_policy
