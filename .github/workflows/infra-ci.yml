name: Infra CI

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-ci.yml'
      - 'docs/deployment-setup.md'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/infra-ci.yml'
      - 'docs/deployment-setup.md'

jobs:
  validate-bicep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: az bicep install

      - name: Validate dev environment
        run: az bicep build --file infra/environments/dev/main.bicep --stdout >/dev/null

      - name: Validate prod environment
        run: az bicep build --file infra/environments/prod/main.bicep --stdout >/dev/null
