name: Code CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/code-ci.yml'
      - '.github/workflows/code-cd.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/code-ci.yml'
      - '.github/workflows/code-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Run repository tests
        run: python -m unittest discover -s tests

  packaging:
    name: Packaging checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distributable packages
        run: |
          for package in src/shared src/cloud src/device; do
            python -m build --outdir "dist/$(basename "$package")" "$package"
          done

      - name: Compile Python sources
        run: python -m compileall -q src tests
