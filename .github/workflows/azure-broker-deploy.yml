name: Azure broker deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'src/broker/**'
      - '.github/workflows/azure-broker-deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: rg-sparky
      AZURE_LOCATION: southcentralus
      AZURE_ENVIRONMENT_NAME: dev
      BROKER_IMAGE_NAME: sparky-broker

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --tags project=sparky environment=$AZURE_ENVIRONMENT_NAME

      - name: Deploy infrastructure
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              resourceGroupName="$AZURE_RESOURCE_GROUP" \
              environmentName="$AZURE_ENVIRONMENT_NAME" \
              location="$AZURE_LOCATION" \
              brokerContainerImage="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"

          echo "ACR_NAME=$(az acr list --resource-group "$AZURE_RESOURCE_GROUP" --query "[0].name" -o tsv)" >> "$GITHUB_ENV"

      - name: Build broker image in ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$BROKER_IMAGE_NAME:latest" \
            --file src/broker/Dockerfile \
            src/broker

      - name: Update broker container app image
        run: |
          BROKER_APP_NAME=$(az containerapp list --resource-group "$AZURE_RESOURCE_GROUP" --query "[?contains(name, 'sparky-broker')].name | [0]" -o tsv)

          az containerapp update \
            --name "$BROKER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/$BROKER_IMAGE_NAME:latest"

      - name: Show broker URL
        run: |
          az containerapp show \
            --name "$(az containerapp list --resource-group "$AZURE_RESOURCE_GROUP" --query "[?contains(name, 'sparky-broker')].name | [0]" -o tsv)" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv
